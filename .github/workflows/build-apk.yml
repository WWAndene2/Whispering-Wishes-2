name: Build APK

# Only ever builds from main — either automatically on every push to main,
# or manually via workflow_dispatch (the ref dropdown defaults to
# main; the guard below hard-stops the job if someone runs it from another
# branch anyway, so main is enforced regardless of what's picked there).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the GitHub Release the in-app updater reads

# One run per workflow and branch: a second trigger for the same push (GitHub has
# delivered some main pushes twice) or a newer push cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse to run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow only builds from main (got $GITHUB_REF) — aborting." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # @capacitor/cli 8.x requires Node >=22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default packages input is "tools platform-tools" - the legacy
          # "tools" meta-package was removed from Google's SDK repository,
          # so sdkmanager now fails outright trying to install it. Drop it;
          # Gradle auto-installs whatever platform/build-tools it needs
          # (licenses are still pre-accepted by this action).
          packages: 'platform-tools'

      - name: Install dependencies
        working-directory: app
        run: npm install

      # Produces dist-native/ (excludes the ~1GB map-tiles/portraits/animated-bg/spine
      # directories and patches the bundled service worker to fetch them from
      # VITE_API_BASE_URL instead) — see capacitor-build/build.mjs and CAPACITOR_APP.md
      # for why this exists. Falls back to the project's own Vercel deployment if the
      # VITE_API_BASE_URL repo secret isn't set, so this works with zero setup; set the
      # secret (Settings → Secrets and variables → Actions) to point at a different
      # deployment instead.
      # VITE_FIREBASE_DB/VITE_FIREBASE_API_KEY/VITE_GOOGLE_CLIENT_ID_NATIVE gate Cloud Backup
      # (CloudStorageProvider.jsx) — unset repo secrets fall through to '' here, which
      # CloudStorageProvider.jsx's own FIREBASE_AVAILABLE check already treats as "feature off"
      # (a "Firebase not configured" toast, nothing crashes), same as it always has on a web
      # build with no .env — so this works with zero setup and Cloud Backup activates the moment
      # the three secrets are set (Settings → Secrets and variables → Actions). Deliberately NOT
      # VITE_GOOGLE_CLIENT_ID (singular) — that one's a "Web application" OAuth client only
      # valid for the web build's popup flow; the native build needs its own client of a type
      # that can redirect to a custom URL scheme (see .env.example's own comment on both vars).
      - name: Build native web bundle (dist-native/)
        working-directory: app
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://whispering-wishes.vercel.app' }}
          VITE_FIREBASE_DB: ${{ secrets.VITE_FIREBASE_DB }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_GOOGLE_CLIENT_ID_NATIVE: ${{ secrets.VITE_GOOGLE_CLIENT_ID_NATIVE }}
        run: npm run build:native

      # android/ (capacitor.config.json, native project, gradle wrapper) is already
      # committed — no `cap add android` here, that would re-scaffold and diverge from
      # what's actually in the repo. Just re-copy the freshly-built dist-native/ into it.
      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      # versionCode/Name are set to this run's number (see android/app/build.gradle's
      # comment) so the in-app update check (src/utils/appUpdate.js) can compare the
      # running app's own build number against the GitHub release published below —
      # tag_name apk-<run number> — with no separate version file to keep in sync.
      # VITE_GOOGLE_CLIENT_ID_NATIVE also needs to reach THIS step, not just "Build native web
      # bundle" above — build.gradle's own googleAuthRedirectScheme reads it via
      # System.getenv() at Gradle configuration time to compute the reversed-client-ID redirect
      # scheme AndroidManifest.xml's Cloud Backup intent-filter needs (see that file's comment).
      - name: Build debug APK
        working-directory: app/android
        env:
          VITE_GOOGLE_CLIENT_ID_NATIVE: ${{ secrets.VITE_GOOGLE_CLIENT_ID_NATIVE }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: whispering-wishes-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Workflow artifacts (above) require a GitHub login and expire in 30 days — not
      # usable as a stable in-app update URL. Releases are public, permanent, and give
      # a predictable browser_download_url the app can fetch via the public releases
      # API (see src/utils/appUpdate.js) without any auth.
      - name: Publish GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: |
            Automated build from ${{ github.sha }}.
            Install: download app-debug.apk below, open it on your Android device
            ("Install unknown apps" must be allowed for the app you download it with —
            see CAPACITOR_APP.md).
          files: app/android/app/build/outputs/apk/debug/*.apk
