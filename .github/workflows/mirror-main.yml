name: Mirror main to Whispering-Wishes-2

# Disabled (user decision 2026-09-30): the mirror push never worked, so it no
# longer runs on push to main. Kept as manual-only so it can be retried.
on:
  workflow_dispatch:

# One run at a time: a duplicate trigger queues behind the running push instead of
# racing it to the mirror (two concurrent pushes made one of them fail).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Push main to mirror repo
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/WWAndene2/Whispering-Wishes-2.git"
          git push mirror main:main
